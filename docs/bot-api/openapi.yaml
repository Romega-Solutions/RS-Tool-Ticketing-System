{
  "openapi": "3.1.0",
  "info": {
    "title": "Scoped read-only portal API (v0)",
    "version": "0.1.0",
    "description": "Server-to-server Bearer access only. All seven GETs require tasks:read and explicit project grants. No cookies/CORS. Default 120 reads/minute including me/304. Unknown/duplicate query parameters fail 400. No business writes. Strong ETags cover complete selected representations, fields/filter/paging/full/truncation, excluding rid. Private/no-store responses; no shared caches. IP filtering is off. Text sanitization is not PII redaction. HEAD/OPTIONS and other methods produce audited 405; they are not additional read operations."
  },
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "paths": {
