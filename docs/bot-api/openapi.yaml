                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ListResponse"
                },
                "example": {
                  "v": 1,
                  "rid": "example-request",
                  "data": {
                    "cols": [
                      "id",
                      "project_id",
                      "sequence",
                      "name",
                      "state_id",
                      "state",
